[project]
name = "finflash-backend"
version = "1.0.0"
description = "FinFlash - Financial News Multi-Agent Analysis System (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    # Agent orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.1",
    # Multi-provider LLM
    "litellm>=1.55.0",
    # Data collection
    "exa-py>=1.14.18",
    "yt-dlp>=2025.7.21",
    # Database (async + vectors)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    # Cache / rate limiting / quota
    "redis>=5.2.0",
    # Config & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # Security
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "passlib[bcrypt]>=1.7.4",
    # Observability
    "langsmith>=0.2.0",
    "python-json-logger>=3.2.0",
    # Utilities
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "services", "core", "rag"]

# ---- Astral toolchain ----
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",      # FastAPI dependency-injection defaults (Depends() in signature)
    "ASYNC240",  # we use stdlib pathlib for quick fs ops; no trio/anyio dependency
]

[tool.ruff.lint.isort]
known-first-party = ["app", "agents", "services", "core", "rag"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
